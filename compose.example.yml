x-runtime-paths: &runtime_paths
  DP_OBJECT_PATH: &object_path /var/lib/dynamic-panel/objects
  DP_BACKUP_PATH: &backup_path /var/lib/dynamic-panel/backups

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dynamic_panel
      POSTGRES_USER: dynamic_panel
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamic_panel -d dynamic_panel"]
      interval: 10s
      timeout: 5s
      retries: 10

  sync-server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *runtime_paths
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "export DATABASE_URL=postgresql://dynamic_panel:$$(cat /run/secrets/postgres_password)@postgres:5432/dynamic_panel; npm run migrate && npm start",
      ]
    ports:
      - "127.0.0.1:43822:43822"
    volumes:
      - type: volume
        source: object-data
        target: *object_path
      - type: volume
        source: backup-data
        target: *backup_path

  backup-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *runtime_paths
    secrets:
      - postgres_password
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      sync-server:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "export DATABASE_URL=postgresql://dynamic_panel:$$(cat /run/secrets/postgres_password)@postgres:5432/dynamic_panel; npm run worker",
      ]
    volumes:
      - type: volume
        source: object-data
        target: *object_path
        read_only: true
      - type: volume
        source: backup-data
        target: *backup_path

volumes:
  postgres-data:
  object-data:
  backup-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
