name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mr-chenh/dynamic-panel-sync-server

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dynamic_panel
          POSTGRES_USER: dynamic_panel_admin
          POSTGRES_PASSWORD: compose-ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynamic_panel_admin -d dynamic_panel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNC_SETUP_DATABASE_URL: postgresql://dynamic_panel_admin:compose-ci-admin-password@127.0.0.1:5432/dynamic_panel
      SYNC_SETUP_APP_PASSWORD: "compose CI app password @:/?#[]%"
      DP_POSTGRES_ADMIN_PASSWORD: compose-validation-admin-password
      DP_POSTGRES_APP_PASSWORD: compose-validation-app-password
      DP_BACKUP_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/server.js
      - run: node --check src/worker.js
      - run: node --check src/db/setup.js
      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose -f compose.example.yml config --quiet
          docker compose -f compose.image.yml config --quiet
      - name: Smoke test Docker Compose stack
        run: |
          sed -i 's/^COOKIE_SECRET=$/COOKIE_SECRET=compose-ci-cookie-secret-at-least-32-bytes/' .env
          sed -i 's/^KEY_LOOKUP_SECRET=$/KEY_LOOKUP_SECRET=compose-ci-lookup-secret-at-least-32-bytes/' .env
          sed -i 's/^CURSOR_SECRET=$/CURSOR_SECRET=compose-ci-cursor-secret-at-least-32-bytes/' .env
          trap 'docker compose -f compose.example.yml down --volumes --remove-orphans' EXIT
          docker compose -f compose.example.yml up --build --detach --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:43822/api/v1/health/live

  publish-image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
